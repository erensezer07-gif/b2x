[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "b2x-backend"
version = "0.1.0"
description = "B2X — B2B etkinlik eşleştirme ve oturma planlama platformu, sunucu tarafı"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "arq>=0.26",
    "redis>=5.2",
    "numpy>=2.1",
    # Kimlik (şartname M1): şifre özetleme ve jetonlar.
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    # E-posta giriş kimliği olduğu için biçimi doğrulanır. MVP'de e-posta
    # *gönderilmez* (Bölüm 2) — bu yalnızca biçim denetimi.
    "pydantic[email]>=2.6",
    # Profil fotoğrafı yüklemesi çok parçalı form verisiyle geliyor (M2).
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
]

# İki üst düzey paket var: app (FastAPI) ve engine (eşleştirme motoru).
# Motor bilinçli olarak ayrı bir pakettir — şartname Bölüm 5.1.
[tool.setuptools.packages.find]
include = ["app*", "engine*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID"]

[tool.ruff.lint.per-file-ignores]
# Migration gövdelerini Alembic üretir; sa.Column(...) satırları doğaları gereği
# uzun ve elle sarmak okunurluğa bir şey katmaz. Diğer kurallar burada da geçerli.
"migrations/versions/*.py" = ["E501"]

[tool.ruff.format]
# Aynı sebeple biçimlendirme de dayatılmaz: her `alembic revision` çıktısı yeniden
# biçimlenmek zorunda kalırdı. Denetim (`ruff check`) bu dosyalarda çalışmaya
# devam ediyor — yalnızca biçim serbest.
exclude = ["migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
