# B2X — servis tanımları
#
# Bu dosya doğrudan çalıştırılmaz. Depo kökündeki compose.yaml bunu içeri alır,
# böylece kökteki .env okunur ve `docker compose up -d` kökten çalışır.
#
# Hiçbir değer buraya gömülmez, hepsi .env dosyasından gelir.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Sol taraf makinedeki port (.env'den), sağ taraf konteynerin sabit portu.
      # Windows'tan native uvicorn bu porta bağlanır.
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build:
      # Göreli yollar depo kökünden (compose.yaml'ın bulunduğu yerden) çözülür.
      context: backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Konteyner ağı içinde servisler adlarıyla bulunur; .env'deki değerler
      # Windows'tan native çalıştırma içindir, burada geçersiz kılınır.
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "${API_PORT}:${API_PORT}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Konteynerin kendi loopback adresi — makineye özel bir adres değil.
      test:
        - CMD-SHELL
        - python -c "import os,urllib.request;urllib.request.urlopen('http://127.0.0.1:'+os.environ['API_PORT']+'/health')"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  worker:
    build:
      # Göreli yollar depo kökünden (compose.yaml'ın bulunduğu yerden) çözülür.
      context: backend
    restart: unless-stopped
    command: ["arq", "app.worker.WorkerSettings"]
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
